plugins {
    id "com.android.application"
    // START: FlutterFire Configuration
    id 'com.google.gms.google-services'
    // END: FlutterFire Configuration
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
    id 'com.google.android.libraries.mapsplatform.secrets-gradle-plugin'
}

def secretPropsFile = file("${rootDir}/secrets.properties")

def secretProps = new Properties()
if (secretPropsFile.exists()) {
    secretProps.load(new FileInputStream(secretPropsFile))
} else {
    throw new FileNotFoundException("Missing 'secrets.properties' file. Please create it in the root directory.")
}


android {
    namespace = "com.example.wuct"
    compileSdk = 34
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "com.example.wuct"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        //may need to add equal signs to the last 3 lines of code in this default config portion if runing android gives errors
        minSdk 23
        targetSdk 34
        versionCode flutter.versionCode
        versionName flutter.versionName
        manifestPlaceholders = [
                GOOGLE_MAPS_API_KEY_ANDROID: secretProps['GOOGLE_MAPS_API_KEY_ANDROID']
        ]
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}

secrets {
    propertiesFileName = "secrets.properties"
    defaultPropertiesFileName = "local.defaults.properties"

    ignoreList.add("sdk.dir")
    ignoreList.add("keyToIgnore")
}
